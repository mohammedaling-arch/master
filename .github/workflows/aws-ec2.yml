name: Deploy React & Node to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build client
        run: |
          cd client
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy Frontend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # strip_components: 2 removes 'client/build' from the path on the server
          source: "client/dist/*"
          target: "/home/${{ secrets.EC2_USERNAME }}/deploy/frontend"
          strip_components: 2

      - name: Deploy Backend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # strip_components: 1 removes 'server' from the path on the server
          source: "server/*"
          target: "/home/${{ secrets.EC2_USERNAME }}/deploy/backend"
          strip_components: 1

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Update Frontend
            sudo mkdir -p /var/www/html
            sudo cp -r /home/${{ secrets.EC2_USERNAME }}/deploy/frontend/* /var/www/html/
            
            # 2. Update Backend
            sudo mkdir -p /var/www/html/server
            sudo cp -r /home/${{ secrets.EC2_USERNAME }}/deploy/backend/* /var/www/html/server/
            
            # 3. Restart Node App
            cd /var/www/html/server
            # Load NVM/Node if not in global path
            [ -s "$HOME/.nvm/nvm.sh" ] && \. "$HOME/.nvm/nvm.sh"
            npm install --production
            pm2 restart api || pm2 start server.js --name "api"
